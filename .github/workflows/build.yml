name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --locked

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: cosmoscope-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: cosmoscope-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: cosmoscope-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          src=target/${{ matrix.target }}/release/cosmoscope
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" ${{ matrix.asset }}
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          file ${{ matrix.asset }}
          ./${{ matrix.asset }} --version
          ./${{ matrix.asset }} --date 2026-01-01 --snapshot 80x24 --at 1 > frame.txt
          test "$(wc -l < frame.txt)" -eq 24
          ./${{ matrix.asset }} saturn --date 2032-06-01 --snapshot 120x40 --at 3 > /dev/null
          ./${{ matrix.asset }} saturn --date 2032-06-01 --graphics sixel --snapshot 120x40 --at 3 > sixel.txt
          grep -q "$(printf '\033')P0;1;0q" sixel.txt
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./${{ matrix.asset }} --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $frame = & ./${{ matrix.asset }} --date 2026-01-01 --snapshot 80x24 --at 1
          if ($frame.Count -ne 24) { Write-Error "expected 24 lines, got $($frame.Count)"; exit 1 }
          # the C runtime is linked in (.cargo/config.toml), so no VC++ Redistributable is needed
          if (Select-String -Path ./${{ matrix.asset }} -Pattern 'VCRUNTIME140' -SimpleMatch -Quiet) {
            Write-Error "the binary depends on VCRUNTIME140.dll"; exit 1
          }
          # basic glyphs (classic console) use nothing outside Consolas and Lucida Console
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          # quadrants, ▏ ◉ ◎ ● ▸ ━ and rounded corners
          $codes = (0x2596..0x259F) + @(0x258F, 0x25C9, 0x25CE, 0x25CF, 0x25B8, 0x2501) + (0x256D..0x2570)
          $missing = '[' + (-join [char[]]$codes) + ']'
          $full = (& ./${{ matrix.asset }} saturn --date 2032-06-01 --glyphs full --snapshot 120x40 --at 3) -join ''
          if ($full -notmatch $missing) { Write-Error "glyph check is not seeing the output"; exit 1 }
          $basic = (& ./${{ matrix.asset }} saturn --date 2032-06-01 --glyphs basic --snapshot 120x40 --at 3) -join ''
          if ($basic -match $missing) {
            Write-Error "basic glyphs contain a symbol console fonts lack: $($Matches[0])"; exit 1
          }
          # HD in Windows Terminal: planets as sixel images
          $sixel = (& ./${{ matrix.asset }} saturn --date 2032-06-01 --graphics sixel --snapshot 120x40 --at 3) -join ''
          if (-not $sixel.Contains([char]27 + 'P0;1;0q')) { Write-Error "no sixel image in the frame"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create -output cosmoscope-macos-universal \
            target/aarch64-apple-darwin/release/cosmoscope target/x86_64-apple-darwin/release/cosmoscope
      - name: Smoke test
        run: |
          lipo -info cosmoscope-macos-universal
          ./cosmoscope-macos-universal --version
          ./cosmoscope-macos-universal --date 2026-01-01 --snapshot 80x24 --at 1 > frame.txt
          test "$(wc -l < frame.txt)" -eq 24
      - uses: actions/upload-artifact@v4
        with:
          name: cosmoscope-macos-universal
          path: cosmoscope-macos-universal

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, msrv, build, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x dist/cosmoscope-linux-* dist/cosmoscope-macos-*
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "cosmoscope $GITHUB_REF_NAME" --generate-notes

  install-test:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: One-line install (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install/install.sh | sh
          ~/.local/bin/cosmoscope --version
      - name: One-line install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install/install.ps1 | iex
          cosmoscope --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
